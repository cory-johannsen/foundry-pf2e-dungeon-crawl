model_list:
  # The fast tier also runs on OpenRouter's free Nemotron: the local Ollama
  # was not running, so every fast call (default combat decisions with <= 8
  # candidates, trap/treasure flavor) failed and combat fell back to the
  # heuristic. Needs OPENROUTER_API_KEY.
  - model_name: fast
    litellm_params:
      model: openrouter/nvidia/nemotron-3.5-lightning:free
      api_key: os.environ/OPENROUTER_API_KEY
  # #966: the reasoning tier runs on OpenRouter's free Nemotron (tool
  # calling supported) -- the local Ollama above was not running, so every
  # reasoning-tier call (#909's /v1/combat-candidates included) was refused.
  # Needs OPENROUTER_API_KEY (passed to this container by docker-compose.yml).
  - model_name: reasoning
    litellm_params:
      model: openrouter/nvidia/nemotron-3.5-lightning:free
      api_key: os.environ/OPENROUTER_API_KEY
  # #138: OpenRouter support, as ready-to-adopt entries rather than the
  # default -- combat decisions only ever request the literal model
  # names "fast"/"reasoning" (COMBAT_REASONING_CANDIDATE_THRESHOLD
  # routing), so these sit inert unless OPENROUTER_API_KEY is set AND
  # the fast/reasoning entries above are repointed at them (see
  # tools/agent-service/README.md's "Configuring model tiers" section).
  # litellm only errors on a model_list entry's missing api_key when
  # something actually requests that model name, so leaving these
  # present with an unset OPENROUTER_API_KEY doesn't break the default
  # local-Ollama setup.
  - model_name: openrouter-fast
    litellm_params:
      model: openrouter/meta-llama/llama-3.1-8b-instruct
      api_key: os.environ/OPENROUTER_API_KEY
  - model_name: openrouter-reasoning
    litellm_params:
      model: openrouter/anthropic/claude-3.5-sonnet
      api_key: os.environ/OPENROUTER_API_KEY
